name: iOS back flash v51
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/ios_back_flash_v51.py
      - name: Verify
        run: |
          node --check motion.js
          node --check app.js
          node --check sw.js
          grep -q 'history-restoring' motion.js
          grep -q 'revealImmediately(root)' motion.js
          grep -q 'Versione app 2.4.51' app.js
          grep -q 'app.js?v=126' index.html
          grep -q 'motion.js?v=4' index.html
          grep -q 'viaggio-nozze-v149' sw.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion.js app.js index.html sw.js
          git commit -m "Corregge flash back iOS 2.4.51 [skip ci]"
          git push
