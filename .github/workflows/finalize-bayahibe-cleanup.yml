name: Finalize Bayahibe cleanup

on:
  push:
    paths:
      - '.github/workflows/finalize-bayahibe-cleanup.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align version and PWA cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'app.js': [
                  ('Versione app 2.4.26', 'Versione app 2.4.28'),
              ],
              'sw.js': [
                  ('const CACHE_NAME = "viaggio-nozze-v121";', 'const CACHE_NAME = "viaggio-nozze-v122";'),
              ],
              'index.html': [
                  ('<script src="data.js?v=105"></script>', '<script src="data.js?v=106"></script>'),
                  ('<script src="app.js?v=104"></script>', '<script src="app.js?v=105"></script>'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f'{filename}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          node --check app.js
          node --check data.js
          node --check sw.js
          git diff --check

          grep -F 'Versione app 2.4.28' app.js
          grep -F 'viaggio-nozze-v122' sw.js
          grep -F 'data.js?v=106' index.html
          grep -F 'app.js?v=105' index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-bayahibe-cleanup.yml
          git add app.js sw.js index.html
          git commit -m "Finalizza pulizia Bayahibe e versione 2.4.28 [skip ci]"
          git push
