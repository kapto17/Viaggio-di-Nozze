name: Ticket wizard v45
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/ticket_wizard_v45.py
      - name: Verify
        run: |
          node --check app.js
          node --check ticket-meta.js
          node --check ticket-sync.js
          node --check sw.js
          grep -q 'Versione app 2.4.45' app.js
          grep -q 'ticket-meta.css?v=3' index.html
          grep -q 'app.js?v=120' index.html
          grep -q 'ticket-meta.js?v=5' index.html
          grep -q 'viaggio-nozze-v143' sw.js
          grep -q 'data-wizard-step="3"' ticket-meta.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js ticket-meta.js ticket-meta.css index.html sw.js
          git commit -m "Aggiunge wizard caricamento biglietti 2.4.45 [skip ci]"
          git push
