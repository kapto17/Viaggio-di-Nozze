name: Cleanup Las Vegas program

on:
  push:
    paths:
      - '.github/workflows/cleanup-las-vegas.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Las Vegas override into data.js
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const dataPath = 'data.js';
          const overridePath = 'program-las-vegas.js';
          let data = fs.readFileSync(dataPath, 'utf8');
          const override = fs.readFileSync(overridePath, 'utf8');

          const sandbox = { console };
          vm.createContext(sandbox);
          vm.runInContext(data + '\n;globalThis.__PROGRAM_GUIDE = PROGRAM_GUIDE;', sandbox);
          vm.runInContext(override, sandbox);
          const finalGuide = sandbox.__PROGRAM_GUIDE;

          const markerStart = 'const PROGRAM_GUIDE = {';
          const start = data.indexOf(markerStart);
          if (start < 0) throw new Error('PROGRAM_GUIDE start not found');
          const suffixMarker = '\n// Approfondimenti sintetici per la schermata "Da vedere".';
          const suffixPos = data.indexOf(suffixMarker, start);
          if (suffixPos < 0) throw new Error('PROGRAM_GUIDE end marker not found');

          const serialized = 'const PROGRAM_GUIDE = ' + JSON.stringify(finalGuide, null, 2) + ';\n';
          data = data.slice(0, start) + serialized + data.slice(suffixPos);
          fs.writeFileSync(dataPath, data);

          // Remove the temporary override from index and bump data cache-buster.
          let index = fs.readFileSync('index.html', 'utf8');
          index = index.replace('<script src="program-las-vegas.js?v=1"></script>\n', '');
          index = index.replace('data.js?v=104', 'data.js?v=105');
          fs.writeFileSync('index.html', index);

          // Remove the override from the service worker and bump cache.
          let sw = fs.readFileSync('sw.js', 'utf8');
          sw = sw.replace('const CACHE_NAME = "viaggio-nozze-v118";', 'const CACHE_NAME = "viaggio-nozze-v119";');
          sw = sw.replace('  "./program-las-vegas.js",\n', '');
          sw = sw.replace(', "/program-las-vegas.js"', '');
          fs.writeFileSync('sw.js', sw);

          fs.unlinkSync(overridePath);
          NODE

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check data.js
          node --check app.js
          node --check sw.js
          if grep -R "program-las-vegas" -n index.html sw.js data.js; then
            echo "Temporary override reference still present"
            exit 1
          fi

      - name: Remove temporary workflow and commit cleanup
        shell: bash
        run: |
          rm .github/workflows/cleanup-las-vegas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge Las Vegas program into data.js [skip ci]"
          git push
