name: Auth persistence iOS v48
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/auth_persistence_ios_v48.py
      - name: Verify
        run: |
          node --check firebase-budget.js
          node --check app.js
          node --check sw.js
          grep -q 'initializeAuth' firebase-budget.js
          grep -q 'indexedDBLocalPersistence' firebase-budget.js
          grep -q 'persistence: \[indexedDBLocalPersistence, browserLocalPersistence\]' firebase-budget.js
          ! grep -q 'setPersistence(auth' firebase-budget.js
          grep -q 'Versione app 2.4.48' app.js
          grep -q 'firebase-budget.js?v=39' index.html
          grep -q 'app.js?v=123' index.html
          grep -q 'viaggio-nozze-v146' sw.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase-budget.js app.js index.html sw.js
          git commit -m "Rende persistente il login iOS PWA 2.4.48 [skip ci]"
          git push
