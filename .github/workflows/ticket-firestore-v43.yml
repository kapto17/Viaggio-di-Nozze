name: Ticket Firestore v43
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/ticket_firestore_v43.py
      - name: Verify
        run: |
          node --check firebase-budget.js
          node --check ticket-meta.js
          node --check ticket-sync.js
          node --check app.js
          node --check sw.js
          grep -q 'Versione app 2.4.43' app.js
          grep -q 'firebase-budget.js?v=37' index.html
          grep -q 'ticket-meta.js?v=3' index.html
          grep -q 'ticket-sync.js?v=3' index.html
          grep -q 'viaggio-nozze-v141' sw.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase-budget.js ticket-meta.js ticket-sync.js app.js index.html sw.js
          git commit -m "Sposta biglietti condivisi su Firestore 2.4.43 [skip ci]"
          git push
