name: Fix motion step 3 jank
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove shared view transition only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css=Path('motion-v3.css')
          text=css.read_text(encoding='utf-8')
          start=text.index('/* Shared card -> city hero transition')
          end=text.index('/* Internal photo zoom on press')
          text=text[:start]+'/* Shared card -> hero transition removed in V32: caused a visible second repaint on mobile. */\n\n'+text[end:]
          text=text.replace('  ::view-transition-group(city-card-shared),\n  ::view-transition-old(city-card-shared),\n  ::view-transition-new(city-card-shared){animation:none!important;}\n','')
          css.write_text(text,encoding='utf-8')

          motion=Path('motion.js')
          text=motion.read_text(encoding='utf-8')
          marker='/* V31 · shared city transition + bottom-nav polish */'
          pos=text.index(marker)
          text=text[:pos]+'''/* V32 · bottom-nav polish only; shared city transition removed */\n(() => {\n  function syncTabPill(){\n    const nav = document.querySelector("nav.tabbar");\n    if(!nav) return;\n    nav.classList.add("motion-nav");\n    const active = Array.from(nav.querySelectorAll("button.active"))\n      .find(btn => !btn.hidden && btn.getClientRects().length);\n    if(!active) return;\n    const navRect = nav.getBoundingClientRect();\n    const btnRect = active.getBoundingClientRect();\n    nav.style.setProperty("--motion-pill-left", `${(btnRect.left-navRect.left).toFixed(1)}px`);\n    nav.style.setProperty("--motion-pill-width", `${btnRect.width.toFixed(1)}px`);\n    nav.classList.add("motion-nav-ready");\n  }\n\n  function initTabPill(){\n    const nav = document.querySelector("nav.tabbar");\n    if(!nav) return;\n    syncTabPill();\n    const observer = new MutationObserver(() => requestAnimationFrame(syncTabPill));\n    observer.observe(nav,{subtree:true,attributes:true,attributeFilter:["class","hidden"]});\n    nav.addEventListener("click",() => requestAnimationFrame(syncTabPill),{passive:true});\n    window.addEventListener("resize",syncTabPill,{passive:true});\n  }\n\n  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded",initTabPill,{once:true});\n  else initTabPill();\n})();\n'''
          motion.write_text(text,encoding='utf-8')

          app=Path('app.js')
          text=app.read_text(encoding='utf-8')
          if 'Versione app 2.4.31' not in text: raise SystemExit('Versione 2.4.31 non trovata')
          app.write_text(text.replace('Versione app 2.4.31','Versione app 2.4.32',1),encoding='utf-8')

          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          text=text.replace('motion-v3.css?v=1','motion-v3.css?v=2',1)
          text=text.replace('app.js?v=108','app.js?v=109',1)
          text=text.replace('motion.js?v=2','motion.js?v=3',1)
          index.write_text(text,encoding='utf-8')

          sw=Path('sw.js')
          text=sw.read_text(encoding='utf-8')
          if 'viaggio-nozze-v125' not in text: raise SystemExit('Cache v125 non trovata')
          sw.write_text(text.replace('viaggio-nozze-v125','viaggio-nozze-v126',1),encoding='utf-8')
          PY

          node --check app.js
          node --check motion.js
          node --check sw.js
          ! grep -q 'startViewTransition' motion.js
          ! grep -q 'view-transition-group(city-card-shared)' motion-v3.css
          grep -q 'Versione app 2.4.32' app.js
          grep -q 'viaggio-nozze-v126' sw.js
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html motion.js motion-v3.css sw.js
          git rm .github/workflows/fix-motion-step3-jank.yml
          git commit -m "Rimuove transizione città scattosa 2.4.32 [skip ci]"
          git push