name: Fix expense wizard tags
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix HTML tags
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          bad_css='<link rel="stylesheet" href="budget-layout.css?v=1\n<link rel="stylesheet" href="expense-wizard.css?v=1">">'
          good_css='<link rel="stylesheet" href="budget-layout.css?v=1">\n<link rel="stylesheet" href="expense-wizard.css?v=1">'
          bad_js='<script src="budget-layout.js?v=2\n<script src="expense-wizard.js?v=1"></script>"></script>'
          good_js='<script src="budget-layout.js?v=2"></script>\n<script src="expense-wizard.js?v=1"></script>'
          if bad_css not in text: raise SystemExit('bad css marker missing')
          if bad_js not in text: raise SystemExit('bad js marker missing')
          text=text.replace(bad_css,good_css,1).replace(bad_js,good_js,1)
          p.write_text(text,encoding='utf-8')
          PY
          node --check app.js
          node --check expense-wizard.js
          grep -q '<link rel="stylesheet" href="expense-wizard.css?v=1">' index.html
          grep -q '<script src="expense-wizard.js?v=1"></script>' index.html
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corregge caricamento wizard spese [skip ci]"
          git push
