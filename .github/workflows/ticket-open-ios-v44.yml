name: Ticket open iOS v44
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/ticket_open_ios_v44.py
      - name: Verify
        run: |
          node --check app.js
          node --check ticket-meta.js
          node --check ticket-sync.js
          node --check sw.js
          grep -q 'Versione app 2.4.44' app.js
          grep -q 'app.js?v=119' index.html
          grep -q 'ticket-meta.js?v=4' index.html
          grep -q 'ticket-sync.js?v=4' index.html
          grep -q 'viaggio-nozze-v142' sw.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js ticket-meta.js ticket-sync.js index.html sw.js
          git commit -m "Corregge apertura biglietti su iPhone 2.4.44 [skip ci]"
          git push
