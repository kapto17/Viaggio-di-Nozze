name: Programma isolato sicuro
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify stable core before change
        run: |
          git diff --quiet ee83d43cb108295fbdf823b72e7ac1b208791568 -- app.js style.css motion.js motion-v3.css
          node --check app.js
          node --check motion.js
      - name: Add isolated Programma files
        run: |
          cat > program-tab.js <<'EOF'
          (() => {
            "use strict";

            const screen = document.getElementById("screen-program");
            if (!screen) return;

            let selectedDate = "";

            const localIsoDate = () => {
              const d = new Date();
              const y = d.getFullYear();
              const m = String(d.getMonth() + 1).padStart(2, "0");
              const day = String(d.getDate()).padStart(2, "0");
              return `${y}-${m}-${day}`;
            };

            const formatChip = (iso) => {
              const d = new Date(`${iso}T12:00:00`);
              return {
                weekday: new Intl.DateTimeFormat("it-IT", { weekday: "short" }).format(d).replace(".", ""),
                day: new Intl.DateTimeFormat("it-IT", { day: "numeric" }).format(d),
                month: new Intl.DateTimeFormat("it-IT", { month: "short" }).format(d).replace(".", "")
              };
            };

            const getRows = () => {
              if (typeof allProgramDays !== "function") return [];
              try {
                return allProgramDays().filter(row => row && row.day && row.day.date);
              } catch (error) {
                console.error("Programma: impossibile leggere le giornate", error);
                return [];
              }
            };

            const chooseDefaultDate = (dates) => {
              if (!dates.length) return "";
              const today = localIsoDate();
              if (dates.includes(today)) return today;
              if (today < dates[0]) return dates[0];
              if (today > dates[dates.length - 1]) return dates[dates.length - 1];
              return dates.find(date => date > today) || dates[0];
            };

            const scrollSelectedIntoView = () => {
              requestAnimationFrame(() => {
                const active = screen.querySelector(".program-date-chip.active");
                active?.scrollIntoView({ behavior: "auto", block: "nearest", inline: "center" });
              });
            };

            const render = (forcedDate = "") => {
              const rows = getRows();
              const dates = [...new Set(rows.map(row => row.day.date))].sort();

              if (!dates.length || typeof programDayHtml !== "function") {
                screen.innerHTML = `
                  <div class="program-hub-head">
                    <h2>Programma</h2>
                    <p>Il viaggio giorno per giorno</p>
                  </div>
                  <div class="empty-note">Programma momentaneamente non disponibile.</div>`;
                return;
              }

              if (forcedDate && dates.includes(forcedDate)) selectedDate = forcedDate;
              if (!dates.includes(selectedDate)) selectedDate = chooseDefaultDate(dates);

              const selectedRows = rows.filter(row => row.day.date === selectedDate);

              screen.innerHTML = `
                <div class="program-hub">
                  <div class="program-hub-head">
                    <h2>Programma</h2>
                    <p>Il viaggio giorno per giorno</p>
                  </div>

                  <div class="program-date-strip" role="tablist" aria-label="Giorni del viaggio">
                    ${dates.map(date => {
                      const label = formatChip(date);
                      const active = date === selectedDate;
                      return `<button type="button" class="program-date-chip${active ? " active" : ""}" data-program-date="${date}" role="tab" aria-selected="${active}">
                        <span>${label.weekday}</span><strong>${label.day}</strong><small>${label.month}</small>
                      </button>`;
                    }).join("")}
                  </div>

                  <div class="program-selected-day">
                    ${selectedRows.map(row => `
                      <div class="program-hub-city">${row.leg.city}</div>
                      ${programDayHtml(row.day)}
                    `).join("")}
                  </div>
                </div>`;

              screen.querySelectorAll(".program-date-chip").forEach(button => {
                button.addEventListener("click", () => render(button.dataset.programDate || ""));
              });

              scrollSelectedIntoView();
            };

            try {
              render();
            } catch (error) {
              console.error("Programma: errore di rendering isolato", error);
              screen.innerHTML = `
                <div class="program-hub-head">
                  <h2>Programma</h2>
                  <p>Il viaggio giorno per giorno</p>
                </div>
                <div class="empty-note">Programma momentaneamente non disponibile.</div>`;
            }
          })();
          EOF

          cat > program-tab.css <<'EOF'
          /* Programma: schermata autonoma, senza modifiche alla navigazione core */
          .program-hub-head{margin:0 0 14px}.program-hub-head h2{margin:0;font-size:24px;line-height:1.1;color:var(--ink)}.program-hub-head p{margin:5px 0 0;font-size:13px;color:var(--ink-soft)}
          .program-date-strip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:2px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.program-date-strip::-webkit-scrollbar{display:none}
          .program-date-chip{flex:0 0 58px;min-height:66px;border:1px solid var(--line);border-radius:15px;background:var(--paper-alt);color:var(--ink);font:inherit;padding:7px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;cursor:pointer}.program-date-chip span{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--ink-soft)}.program-date-chip strong{font-size:20px;margin:4px 0 3px}.program-date-chip small{font-size:10px;font-weight:700;color:var(--ink-soft);text-transform:uppercase}.program-date-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:var(--shadow)}.program-date-chip.active span,.program-date-chip.active small{color:var(--brass-soft)}
          .program-selected-day{min-width:0}.program-hub-city{margin:2px 0 8px;font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
          #screen-program .program-day{margin-bottom:18px}
          html[data-theme="classic"] #screen-program .program-date-chip.active,html[data-theme="green"] #screen-program .program-date-chip.active,html[data-theme="blue"] #screen-program .program-date-chip.active{background:var(--theme-ink,var(--ink));border-color:var(--theme-ink,var(--ink));color:var(--theme-panel,#fff)}
          EOF
      - name: Patch only index and service worker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              '<link rel="stylesheet" href="ticket-meta.css?v=4">\n',
              '<link rel="stylesheet" href="ticket-meta.css?v=4">\n<link rel="stylesheet" href="program-tab.css?v=1">\n',
              'index css')
          s = replace_once(s,
              '    <section class="screen" id="screen-cities"></section>\n',
              '    <section class="screen" id="screen-cities"></section>\n    <section class="screen" id="screen-program"></section>\n',
              'index screen')
          old_button = '''    <button data-screen="cities">\n      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 21s7-7.2 7-12a7 7 0 10-14 0c0 4.8 7 12 7 12z"/></svg>\n      Città\n    </button>'''
          new_button = '''    <button data-screen="program" aria-label="Programma del viaggio">\n      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h2M14 14h2M8 18h2M14 18h2"/></svg>\n      Programma\n    </button>'''
          s = replace_once(s, old_button, new_button, 'index nav button')
          s = replace_once(s,
              '<script src="app.js?v=126"></script>\n',
              '<script src="app.js?v=126"></script>\n<script src="program-tab.js?v=1"></script>\n',
              'index script')
          p.write_text(s, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, 'const CACHE_NAME = "viaggio-nozze-v149";', 'const CACHE_NAME = "viaggio-nozze-v152";', 'sw cache')
          s = replace_once(s,
              '  "./ticket-meta.css",\n',
              '  "./ticket-meta.css",\n  "./program-tab.css",\n',
              'sw css asset')
          s = replace_once(s,
              '  "./ticket-meta.js",\n',
              '  "./ticket-meta.js",\n  "./program-tab.js",\n',
              'sw js asset')
          s = replace_once(s,
              '"/ticket-meta.js", "/ticket-meta.css", "/ticket-sync.js"',
              '"/ticket-meta.js", "/ticket-meta.css", "/program-tab.js", "/program-tab.css", "/ticket-sync.js"',
              'sw core assets')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify isolated change
        run: |
          node --check program-tab.js
          node --check app.js
          node --check sw.js
          git diff --quiet -- app.js style.css motion.js motion-v3.css data.js firebase-budget.js
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html program-tab.css program-tab.js sw.js "
          grep -q 'data-screen="program"' index.html
          grep -q 'id="screen-program"' index.html
          grep -q 'program-tab.js?v=1' index.html
          grep -q 'viaggio-nozze-v152' sw.js
          git diff --check
          git diff --stat
      - name: Commit isolated Programma
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js program-tab.js program-tab.css
          git commit -m "Aggiunge Programma isolato senza toccare il core [skip ci]"
          git push
