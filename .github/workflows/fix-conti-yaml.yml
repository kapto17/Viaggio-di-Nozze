name: Fix conti workflow
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix YAML
        shell: bash
        run: |
          sed -i '1s/.*/name: "Conti L\&F"/' .github/workflows/conti-lf.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/conti-lf.yml
          git rm .github/workflows/fix-conti-yaml.yml
          git commit -m "Corregge YAML workflow conti [skip ci]"
          git push
