name: Lakers 23 October
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/lakers_23oct_patch.py
      - name: Verify
        run: |
          node --check data.js
          node --check app.js
          node --check sw.js
          grep -q 'Los Angeles Lakers vs LA Clippers' data.js
          grep -q 'Yard House L.A. LIVE' data.js
          grep -q 'Versione app 2.4.38' app.js
          grep -q 'data.js?v=107' index.html
          grep -q 'viaggio-nozze-v135' sw.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js app.js index.html sw.js
          git commit -m "Rimodula 23 ottobre per Lakers-Clippers 2.4.38 [skip ci]"
          git push
