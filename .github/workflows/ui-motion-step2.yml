name: UI motion step 2
on: [push]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply motion step 2
        shell: bash
        run: |
          echo '' | base64 -d > motion.js
          if ! grep -q 'V30: motion polish step 2' style.css; then
            printf '\n\n' >> style.css
            echo '' | base64 -d >> style.css
          fi
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          replacements = [
              ('style.css?v=80', 'style.css?v=81'),
              ('app.js?v=106', 'app.js?v=107'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing index marker: {old}')
              text = text.replace(old, new, 1)
          if 'motion.js?v=1' not in text:
              marker = '<script src="app.js?v=107"></script>'
              if marker not in text:
                  raise SystemExit('missing app script marker')
              text = text.replace(marker, marker + '\n<script src="motion.js?v=1"></script>', 1)
          index.write_text(text, encoding='utf-8')

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          if 'Versione app 2.4.29' not in text:
              raise SystemExit('missing app version marker')
          text = text.replace('Versione app 2.4.29', 'Versione app 2.4.30', 1)
          app.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          if 'viaggio-nozze-v123' not in text:
              raise SystemExit('missing cache marker')
          text = text.replace('viaggio-nozze-v123', 'viaggio-nozze-v124', 1)
          if '"./motion.js"' not in text:
              marker = '  "./app.js",\n'
              if marker not in text:
                  raise SystemExit('missing app asset marker')
              text = text.replace(marker, marker + '  "./motion.js",\n', 1)
          core_old = '["/style.css", "/app.js", "/data.js", "/firebase-budget.js", "/manifest.json"]'
          core_new = '["/style.css", "/app.js", "/motion.js", "/data.js", "/firebase-budget.js", "/manifest.json"]'
          if core_old not in text:
              raise SystemExit('missing core asset marker')
          text = text.replace(core_old, core_new, 1)
          sw.write_text(text, encoding='utf-8')
          PY
          node --check app.js
          node --check motion.js
          git diff --check
          git rm .github/workflows/ui-motion-step2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css motion.js index.html app.js sw.js
          git commit -m 'Aggiunge parallax reveal e timeline 2.4.30 [skip ci]'
          git push