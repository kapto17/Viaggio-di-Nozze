name: Budget summary v37
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/budget_summary_v37_patch.py
      - name: Verify
        run: |
          node --check app.js
          node --check expense-wizard.js
          node --check budget-layout.js
          node --check budget-summary.js
          node --check sw.js
          grep -q 'expense-currency' app.js
          grep -q 'budget-summary.css?v=1' index.html
          grep -q 'budget-summary.js?v=1' index.html
          grep -q 'viaggio-nozze-v133' sw.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js
          git commit -m "Aggiunge riepilogo spese e budget Bayahibe DOP 2.4.37 [skip ci]"
          git push
