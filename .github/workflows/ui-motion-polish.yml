name: UI motion polish
on: [push]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply motion polish
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/polish.py
          python3 /tmp/polish.py
          node --check app.js
          node --check sw.js
          git diff --check
          grep -q 'V29: motion polish premium' style.css
          grep -q 'style.css?v=80' index.html
          grep -q 'app.js?v=106' index.html
          grep -q 'Versione app 2.4.29' app.js
          grep -q 'viaggio-nozze-v123' sw.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ui-motion-polish.yml
          git add style.css index.html app.js sw.js
          git commit -m 'Aggiunge motion polish premium 2.4.29 [skip ci]'
          git push
