name: Today weather v40
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/today_weather_v40.py
      - name: Verify
        run: |
          node --check app.js
          node --check today-weather.js
          node --check sw.js
          grep -q 'Versione app 2.4.40' app.js
          grep -q 'today-weather.js?v=1' index.html
          grep -q 'today-weather.css?v=1' index.html
          grep -q 'viaggio-nozze-v137' sw.js
          grep -q 'today-weather.js' sw.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js
          git commit -m "Aggiunge Oggi Domani e meteo orario 2.4.40 [skip ci]"
          git push
