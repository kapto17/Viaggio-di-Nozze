name: Ticket meta v41
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/ticket_meta_v41.py
      - name: Verify
        run: |
          node --check app.js
          node --check ticket-meta.js
          node --check sw.js
          grep -q 'Versione app 2.4.41' app.js
          grep -q 'ticket-meta.js?v=1' index.html
          grep -q 'ticket-meta.css?v=1' index.html
          grep -q 'viaggio-nozze-v138' sw.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js
          git commit -m "Aggiunge nome e proprietario biglietti 2.4.41 [skip ci]"
          git push
