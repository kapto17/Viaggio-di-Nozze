name: Classic private access v47
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/classic_private_access_v47.py
      - name: Verify
        run: |
          node --check app.js
          node --check sw.js
          grep -q 'Versione app 2.4.47' app.js
          grep -q 'bindClassicPrivateAccess' app.js
          grep -q 'app.js?v=122' index.html
          grep -q 'viaggio-nozze-v145' sw.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js
          git commit -m "Corregge accesso L&F dal tema classico 2.4.47 [skip ci]"
          git push
