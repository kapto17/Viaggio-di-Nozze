name: Fix split copy
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update split wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          text=p.read_text(encoding='utf-8')
          old='Il saldo compensa automaticamente tutte le spese 50/50 e i pareggi già registrati.'
          new='Il saldo compensa automaticamente spese condivise, spese personali anticipate e pareggi già registrati.'
          if old not in text: raise SystemExit('app copy marker missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('budget-layout.js')
          text=p.read_text(encoding='utf-8')
          old='Saldo 50/50, pareggi manuali e storico: qui non viene modificato il budget speso.'
          new='Spese condivise, personali e pareggi: qui vedi solo ciò che resta da compensare tra voi.'
          if old not in text: raise SystemExit('layout copy marker missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          if 'app.js?v=111' not in text or 'budget-layout.js?v=2' not in text: raise SystemExit('index markers missing')
          text=text.replace('app.js?v=111','app.js?v=112',1).replace('budget-layout.js?v=2','budget-layout.js?v=3',1)
          p.write_text(text,encoding='utf-8')

          p=Path('sw.js')
          text=p.read_text(encoding='utf-8')
          if 'viaggio-nozze-v130' not in text: raise SystemExit('cache marker missing')
          p.write_text(text.replace('viaggio-nozze-v130','viaggio-nozze-v131',1),encoding='utf-8')
          PY
          node --check app.js
          node --check budget-layout.js
          node --check expense-wizard.js
          node --check sw.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js budget-layout.js index.html sw.js
          git commit -m "Allinea testi Conti L&F alle spese personali [skip ci]"
          git push
