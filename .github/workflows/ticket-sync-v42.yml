name: Ticket sync v42
on: [push]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/ticket_sync_v42.py
      - name: Verify
        run: |
          node --check app.js
          node --check ticket-meta.js
          node --check ticket-sync.js
          node --check sw.js
          grep -q 'Versione app 2.4.42' app.js
          grep -q 'firebase-budget.js?v=36' index.html
          grep -q 'ticket-meta.js?v=2' index.html
          grep -q 'ticket-sync.js?v=1' index.html
          grep -q 'viaggio-nozze-v139' sw.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js
          git commit -m "Attiva biglietti condivisi L&F 2.4.42 [skip ci]"
          git push
