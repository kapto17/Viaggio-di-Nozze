name: Rollback 2.4.51 again
on: [push]
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact stable 2.4.51 files
        run: |
          git checkout ee83d43cb108295fbdf823b72e7ac1b208791568 -- app.js index.html style.css sw.js
      - name: Verify rollback
        run: |
          node --check app.js
          node --check sw.js
          grep -q 'Versione app 2.4.51' app.js
          grep -q 'app.js?v=126' index.html
          grep -q 'motion.js?v=4' index.html
          grep -q 'viaggio-nozze-v149' sw.js
          git diff --check
      - name: Commit rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css sw.js
          git commit -m "Rollback esatto a 2.4.51 dopo regressione Programma [skip ci]"
          git push
