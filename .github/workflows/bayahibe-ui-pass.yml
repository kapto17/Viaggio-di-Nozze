name: Bayahibe UI cleanup
on: [push]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/bayahibe_ui.py
          python3 /tmp/bayahibe_ui.py
          node --check app.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bayahibe-ui-pass.yml
          git add app.js
          git commit -m "Integra UI Bayahibe in app.js [skip ci]"
          git push
