name: Conti condivisi LF
on: [push]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply conti LF
        shell: bash
        run: |
          python scripts/apply-conti-lf.py
          node --check app.js
          node --input-type=module --check < firebase-budget.js
          node --check sw.js
          git diff --check
          grep -q 'Versione app 2.4.33' app.js
          grep -q 'addSettlement' firebase-budget.js
          grep -q 'Pagato da' app.js
          grep -q 'Conti L&F / Splitwise lite' style.css
          grep -q 'viaggio-nozze-v127' sw.js
          node <<'NODE'
          let paidL=100, paidF=45, total=paidL+paidF;
          let balance=paidL-total/2;
          if(Math.abs(balance-27.5)>0.001) throw new Error('Saldo base errato');
          balance-=27.5;
          if(Math.abs(balance)>0.001) throw new Error('Pareggio errato');
          console.log('Split ledger smoke test OK');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js firebase-budget.js style.css index.html sw.js
          git rm scripts/apply-conti-lf.py
          git commit -m "Aggiunge conti condivisi L&F 2.4.33 [skip ci]"
          git push
