    ]}
  ],'''
          text = text[:start] + '\n' + chicago.strip('\n') + text[end:]

          # Add a concise detail page for the new architectural stop.
          anchor = '  "Chicago Water Tower": {\n'
          detail = '''  "Wrigley Building & Tribune Tower": {\n    text: "Il Wrigley Building e la Tribune Tower si fronteggiano all’imbocco settentrionale del Michigan Avenue Bridge e formano uno degli scorci architettonici più riconoscibili di Chicago. Il Wrigley Building, completato negli anni Venti, è noto per la facciata bianca in terracotta e la torre dell’orologio; la neogotica Tribune Tower fu progettata dopo il celebre concorso internazionale del 1922. Nel vostro itinerario sono una tappa breve e naturale tra Magnificent Mile e Riverwalk."\n  },\n'''
          if anchor not in text:
              raise SystemExit('PLACE_DETAILS Chicago Water Tower anchor not found')
          text = text.replace(anchor, detail + anchor, 1)

          p.write_text(text, encoding='utf-8')

          app = Path('app.js')
          app_text = app.read_text(encoding='utf-8')
          if 'Versione app 2.4.25' not in app_text:
              raise SystemExit('Expected app version 2.4.25 not found')
          app.write_text(app_text.replace('Versione app 2.4.25', 'Versione app 2.4.26', 1), encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
