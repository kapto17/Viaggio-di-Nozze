<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L&F · Viaggio di nozze</title>
<meta name="theme-color" content="#F6F1E8">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-v10-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-v10-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-v10-512.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-v10-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="L&F Viaggio">
<link rel="stylesheet" href="style.css?v=78">
<link rel="stylesheet" href="themes.css?v=53">

<style>
/* v2.3.25 — Home Classico: illustrazione fornita dall'utente come hero */
html[data-theme="classic"] .honeymoon-topbar:not(.home-only-hidden){
  position:relative!important;
  box-sizing:border-box!important;
  width:calc(100% - 28px)!important;
  height:auto!important;
  min-height:0!important;
  aspect-ratio:1536 / 1162;
  margin:12px 14px 18px!important;
  padding:0!important;
  overflow:hidden!important;
  border-radius:22px!important;
  background-color:#efe2bd!important;
  background-image:url("./assets/classic-home-map-v2.webp")!important;
  background-repeat:no-repeat!important;
  background-position:center center!important;
  background-size:contain!important;
  box-shadow:0 10px 28px rgba(19,42,69,.12)!important;
}

/* Nel Classico la mappa sostituisce completamente titolo e decorazione. */
html[data-theme="classic"] .honeymoon-topbar:not(.home-only-hidden) .honeymoon-title-wrap{
  display:none!important;
}

/* Il menu temi resta disponibile, sovrapposto senza coprire la mappa. */
html[data-theme="classic"] .honeymoon-topbar:not(.home-only-hidden) .theme-menu-btn{
  position:absolute!important;
  z-index:4!important;
  top:max(12px, env(safe-area-inset-top))!important;
  left:12px!important;
  margin:0!important;
  padding:8px!important;
  border-radius:12px!important;
  background:rgba(255,255,255,.88)!important;
  box-shadow:0 3px 12px rgba(20,30,40,.16)!important;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

@media(max-width:600px){
  html[data-theme="classic"] .honeymoon-topbar:not(.home-only-hidden){
    width:calc(100% - 20px)!important;
    margin-top:calc(env(safe-area-inset-top) + 8px)!important;
    margin-right:10px!important;
    margin-bottom:16px!important;
    margin-left:10px!important;
    border-radius:20px!important;
    /* Mantiene l'intera immagine: nessun crop su smartphone. */
    aspect-ratio:1536 / 1162;
    background-size:contain!important;
  }
}
</style>

<style>
/* v2.3.27 — Fusi orari, solo tema Classico */
html[data-theme="classic"] .timezone-box{
  background:transparent!important;
  border:none!important;
  box-shadow:none!important;
}
html[data-theme="classic"] .timezone-box-title{
  color:var(--ink)!important;
}
html[data-theme="classic"] .world-clock-card{
  border:1px solid rgba(176,76,91,.16)!important;
  box-shadow:0 7px 18px -15px rgba(69,43,43,.35)!important;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
html[data-theme="classic"] .world-clock-card.world-clock-0{
  background:linear-gradient(145deg,#fffaf1 0%,#f8efe1 100%)!important;
}
html[data-theme="classic"] .world-clock-card.world-clock-1{
  background:linear-gradient(145deg,#fff7f4 0%,#f8e8e4 100%)!important;
}
html[data-theme="classic"] .world-clock-card.world-clock-2{
  background:linear-gradient(145deg,#f8fbff 0%,#e9eef7 100%)!important;
}
html[data-theme="classic"] .world-clock-card.world-clock-3{
  background:linear-gradient(145deg,#fbfaf1 0%,#edf1df 100%)!important;
}
html[data-theme="classic"] .world-clock-card strong,
html[data-theme="classic"] .world-clock-card b{
  color:#172238!important;
}
html[data-theme="classic"] .world-clock-card small,
html[data-theme="classic"] .world-clock-card span{
  color:#5f6670!important;
}
</style>

</head>
<body>
<div id="offline-badge" class="offline-badge">● Modalità offline — dati locali</div>

<div id="app">
  <div class="topbar honeymoon-topbar">
    <button id="theme-menu-btn" class="theme-menu-btn" type="button" aria-label="Apri menu temi" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="honeymoon-title-wrap">
      <h1>Viaggio di Nozze</h1>
      <svg class="honeymoon-heart-line" viewBox="0 0 320 70" aria-hidden="true" focusable="false">
        <path d="M6 42 C55 42 73 51 105 43 C126 38 137 34 145 28 C151 23 151 11 160 10 C169 11 169 23 175 28 C183 34 194 38 215 43 C247 51 265 42 314 42"/>
        <path d="M160 10 C151 -4 130 -1 130 14 C130 28 145 37 160 49 C175 37 190 28 190 14 C190 -1 169 -4 160 10 Z"/>
      </svg>
    </div>
  </div>

  <div id="theme-panel-backdrop" class="theme-panel-backdrop" hidden></div>
  <aside id="theme-panel" class="theme-panel" aria-hidden="true" aria-label="Scelta tema">
    <div class="theme-panel-head">
      <div>
        <small>PERSONALIZZA</small>
        <h2>Tema dell'app</h2>
      </div>
      <button id="theme-panel-close" class="theme-panel-close" type="button" aria-label="Chiudi">×</button>
    </div>
    <p class="theme-panel-intro">Il tema viene salvato solo su questo dispositivo.</p>

    <button class="theme-choice" type="button" data-theme-choice="classic">
      <span class="theme-swatch theme-swatch-classic"><i></i><i></i><i></i></span>
      <span><strong>Originale</strong><small>Panna, bianco e rosso romantico</small></span>
      <b class="theme-check">✓</b>
    </button>

    <button class="theme-choice" type="button" data-theme-choice="green">
      <span class="theme-swatch theme-swatch-green"><i></i><i></i><i></i></span>
      <span><strong>Verde</strong><small>Oliva, verde e bianco</small></span>
      <b class="theme-check">✓</b>
    </button>

    <button class="theme-choice" type="button" data-theme-choice="blue">
      <span class="theme-swatch theme-swatch-blue"><i></i><i></i><i></i></span>
      <span><strong>Blu Chicago</strong><small>Cielo, bianco e blu profondo</small></span>
      <b class="theme-check">✓</b>
    </button>
  </aside>

  <main>
    <section class="screen active" id="screen-home"></section>
    <section class="screen" id="screen-cities"></section>
    <section class="screen" id="screen-city-detail"></section>
    <section class="screen" id="screen-food-detail"></section>
    <section class="screen" id="screen-place-detail"></section>
    <section class="screen" id="screen-restaurant-detail"></section>
    <section class="screen" id="screen-checklist"></section>
    <section class="screen" id="screen-private-access"></section>
    <section class="screen" id="screen-budget"></section>
    <section class="screen" id="screen-sos"></section>
  </main>

  <nav class="tabbar">
    <button class="active" data-screen="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </button>
    <button data-screen="cities">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 21s7-7.2 7-12a7 7 0 10-14 0c0 4.8 7 12 7 12z"/></svg>
      Città
    </button>
    <button id="budget-tab" data-screen="budget" hidden aria-label="Budget L&F">
      <span class="tab-dollar" aria-hidden="true">$</span>
      Budget
    </button>
    <button id="sos-tab" data-screen="sos" hidden aria-label="SOS e informazioni utili">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 16H3L12 3z"/><path d="M12 9v4"/><path d="M12 16h.01"/></svg>
      SOS
    </button>
  </nav>
</div>

<script src="data.js?v=97"></script>
<script type="module" src="firebase-budget.js?v=32"></script>
<script src="app.js?v=97"></script>
</body>
</html>
